name: Сборка APK

# Весь Android-проект описан прямо здесь и разворачивается при сборке.
# Само приложение — index.html из корня репозитория, тот же, что на сайте.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Разворачиваю Android-проект
        run: |
          mkdir -p android android/app android/app/src/main android/app/src/main/java/ru/tochno/app android/app/src/main/res/drawable android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/values android/app/src/main/res/xml

          cat > android/settings.gradle <<'TOCHNO_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "tochno"
          include ":app"
          TOCHNO_EOF

          cat > android/build.gradle <<'TOCHNO_EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          TOCHNO_EOF

          cat > android/gradle.properties <<'TOCHNO_EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          TOCHNO_EOF

          cat > android/app/build.gradle <<'TOCHNO_EOF'
          plugins {
              id 'com.android.application'
          }

          // Ключ подписи и номер сборки приходят из GitHub Actions
          def ksFile = System.getenv("KEYSTORE_FILE")
          def ksPass = System.getenv("KEYSTORE_PASSWORD")
          def runNo  = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

          android {
              namespace 'ru.tochno.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'ru.tochno.app'
                  minSdk 26
                  targetSdk 35
                  versionCode runNo
                  versionName "1.0.${runNo}"
              }

              signingConfigs {
                  release {
                      if (ksFile) {
                          storeFile file(ksFile)
                          storeType 'pkcs12'
                          storePassword ksPass
                          keyAlias 'tochno'
                          keyPassword ksPass
                      }
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      // без секретов подпишется временным ключом — APK соберётся, но обновить поверх не получится
                      signingConfig ksFile ? signingConfigs.release : signingConfigs.debug
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }

          dependencies {
              implementation 'androidx.core:core:1.13.1'
          }
          TOCHNO_EOF

          cat > android/app/src/main/AndroidManifest.xml <<'TOCHNO_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <!-- Разрешения на интернет нет намеренно: приложение работает полностью офлайн -->
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:label="Точно"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@style/Tochno"
                  android:allowBackup="true"
                  android:supportsRtl="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|uiMode|density">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <!-- через него камера отдаёт снимок обратно в приложение -->
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="ru.tochno.app.files"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          TOCHNO_EOF

          cat > android/app/src/main/java/ru/tochno/app/MainActivity.java <<'TOCHNO_EOF'
          package ru.tochno.app;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.MediaStore;
          import android.view.ViewGroup;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;

          import androidx.core.content.FileProvider;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.nio.charset.StandardCharsets;
          import java.nio.file.Files;

          public class MainActivity extends Activity {

              private static final int REQ_FILE = 1;
              private static final int BG = Color.parseColor("#141C26");

              private WebView web;
              private ValueCallback<Uri[]> fileCallback;
              private File cameraFile;
              private Uri cameraUri;

              @Override
              protected void onCreate(Bundle saved) {
                  super.onCreate(saved);

                  // Контент под системными панелями, отступы задаём сами — одинаково на всех версиях Android
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);

                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(BG);

                  web = new WebView(this);
                  web.setBackgroundColor(BG);
                  root.addView(web, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  setContentView(root);

                  ViewCompat.setOnApplyWindowInsetsListener(root, (v, insets) -> {
                      Insets i = insets.getInsets(WindowInsetsCompat.Type.systemBars()
                              | WindowInsetsCompat.Type.displayCutout()
                              | WindowInsetsCompat.Type.ime());
                      v.setPadding(i.left, i.top, i.right, i.bottom);
                      return WindowInsetsCompat.CONSUMED;
                  });

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setTextZoom(100); // размер текста регулируется ползунком внутри приложения

                  web.addJavascriptInterface(new Store(getFilesDir()), "TochnoNative");
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback,
                                                       FileChooserParams params) {
                          return openPicker(callback, params.isCaptureEnabled());
                      }
                  });

                  web.loadUrl("file:///android_asset/index.html");
              }

              // ---------- фото: камера для пунктов, галерея для фона ----------

              private boolean openPicker(ValueCallback<Uri[]> callback, boolean cameraOnly) {
                  if (fileCallback != null) fileCallback.onReceiveValue(null);
                  fileCallback = callback;

                  Intent camera = cameraIntent();
                  Intent intent;
                  if (cameraOnly && camera != null) {
                      intent = camera;
                  } else {
                      Intent pick = new Intent(Intent.ACTION_GET_CONTENT);
                      pick.addCategory(Intent.CATEGORY_OPENABLE);
                      pick.setType("image/*");
                      intent = Intent.createChooser(pick, "Выберите фото");
                      if (camera != null) intent.putExtra(Intent.EXTRA_INITIAL_INTENTS, new Intent[]{camera});
                  }

                  try {
                      startActivityForResult(intent, REQ_FILE);
                      return true;
                  } catch (Exception e) {
                      fileCallback = null;
                      return false;
                  }
              }

              private Intent cameraIntent() {
                  try {
                      File dir = new File(getCacheDir(), "cam");
                      if (!dir.exists() && !dir.mkdirs()) return null;
                      cameraFile = new File(dir, "shot.jpg");
                      if (cameraFile.exists()) cameraFile.delete();
                      cameraUri = FileProvider.getUriForFile(this, getPackageName() + ".files", cameraFile);

                      Intent i = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);
                      i.putExtra(MediaStore.EXTRA_OUTPUT, cameraUri);
                      i.setClipData(ClipData.newRawUri("", cameraUri));
                      i.addFlags(Intent.FLAG_GRANT_WRITE_URI_PERMISSION | Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      return i;
                  } catch (Exception e) {
                      return null;
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode != REQ_FILE || fileCallback == null) return;

                  Uri[] result = null;
                  if (resultCode == RESULT_OK) {
                      if (data != null && data.getData() != null) {
                          result = new Uri[]{data.getData()};
                      } else if (cameraFile != null && cameraFile.exists() && cameraFile.length() > 0) {
                          result = new Uri[]{cameraUri};
                      }
                  }
                  fileCallback.onReceiveValue(result);
                  fileCallback = null;
              }

              // ---------- хранение данных в файле телефона ----------

              static class Store {
                  private final File file;
                  private final File tmp;

                  Store(File dir) {
                      file = new File(dir, "data.json");
                      tmp = new File(dir, "data.json.tmp");
                  }

                  @JavascriptInterface
                  public synchronized String load() {
                      try {
                          if (!file.exists()) return "";
                          return new String(Files.readAllBytes(file.toPath()), StandardCharsets.UTF_8);
                      } catch (Exception e) {
                          return "";
                      }
                  }

                  // пишем во временный файл и подменяем — при обрыве старые данные не портятся
                  @JavascriptInterface
                  public synchronized boolean save(String json) {
                      try (FileOutputStream out = new FileOutputStream(tmp)) {
                          out.write(json.getBytes(StandardCharsets.UTF_8));
                          out.getFD().sync();
                      } catch (Exception e) {
                          return false;
                      }
                      return tmp.renameTo(file);
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (web != null) web.onResume();
              }

              @Override
              protected void onPause() {
                  if (web != null) web.onPause();
                  super.onPause();
              }
          }
          TOCHNO_EOF

          cat > android/app/src/main/res/values/themes.xml <<'TOCHNO_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Tochno" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@color/bg</item>
                  <item name="android:statusBarColor">@color/bg</item>
                  <item name="android:navigationBarColor">@color/nav</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          TOCHNO_EOF

          cat > android/app/src/main/res/values/colors.xml <<'TOCHNO_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg">#141C26</color>
              <color name="nav">#0D131B</color>
              <color name="accent">#8FBBA4</color>
          </resources>
          TOCHNO_EOF

          cat > android/app/src/main/res/xml/file_paths.xml <<'TOCHNO_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="cam" path="cam/" />
          </paths>
          TOCHNO_EOF

          cat > android/app/src/main/res/drawable/ic_launcher_fg.xml <<'TOCHNO_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:pathData="M33.5,54.5 L47.6,69 L73.1,39.5"
                  android:fillColor="#00000000"
                  android:strokeColor="@color/accent"
                  android:strokeWidth="5.5"
                  android:strokeLineCap="round"
                  android:strokeLineJoin="round" />
          </vector>
          TOCHNO_EOF

          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'TOCHNO_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/bg" />
              <foreground android:drawable="@drawable/ic_launcher_fg" />
              <monochrome android:drawable="@drawable/ic_launcher_fg" />
          </adaptive-icon>
          TOCHNO_EOF

      - name: Копирую приложение внутрь APK
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html manifest.webmanifest icon-192.png icon-512.png android/app/src/main/assets/

      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tochno.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/tochno.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::Секрет KEYSTORE_BASE64 не задан — APK подписан временным ключом, обновление поверх установленного не встанет"
          fi

      - name: Сборка
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Имя файла
        run: cp android/app/build/outputs/apk/release/app-release.apk "tochno-1.0.${{ github.run_number }}.apk"

      - name: Публикация в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Точно 1.0.${{ github.run_number }}
          files: tochno-1.0.${{ github.run_number }}.apk
          make_latest: true

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#141C26">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Точно</title>
<style>
:root{
  --ink:#141C26;
  --paper:#EEF2F6;
  --muted:#93A3B4;
  --line:rgba(238,242,246,.13);
  --ac:#8FBBA4;
  --sage:var(--ac);
  --sand:var(--ac);
  --surface:rgba(20,28,38,.62);
  --scrim:.55;
  --r:14px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  color:var(--paper);
  background:var(--ink);
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
#bg{position:fixed;inset:0;z-index:-2;background:linear-gradient(170deg,#1B2836,#141C26 60%,#101720);background-size:cover;background-position:center}
#scrim{position:fixed;inset:0;z-index:-1;background:#0D131B;opacity:var(--scrim);transition:opacity .2s}
#view{padding:calc(var(--safe-t) + 22px) 20px calc(94px + var(--safe-b));max-width:620px;margin:0 auto;min-height:100%}

/* ---------- шапка дня ---------- */
.daylabel{font-size:13px;color:var(--muted);letter-spacing:.02em}
.date{font-size:32px;font-weight:300;line-height:1.15;margin:2px 0 0;letter-spacing:-.01em}
.date b{font-weight:500}
.scenline{display:flex;align-items:baseline;gap:10px;margin-top:14px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.scenname{font-size:16px;font-weight:500}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto}
.count.done{color:var(--sage)}

/* ---------- пункты ---------- */
.list{list-style:none;margin:0;padding:0}
.item{border-bottom:1px solid var(--line);position:relative}
.row{display:flex;align-items:flex-start;gap:14px;padding:17px 2px;transition:filter .22s,opacity .22s}
.item.pending .row{filter:blur(4px);opacity:.5;pointer-events:none}
.box{flex:none;width:22px;height:22px;border:1.5px solid var(--muted);border-radius:7px;margin-top:1px;display:grid;place-items:center;transition:.18s}
.item.locked .box{border-color:var(--sage);background:var(--sage)}
.box svg{width:13px;height:13px;opacity:0;transform:scale(.7);transition:.18s}
.item.locked .box svg{opacity:1;transform:none}
.txt{font-size:16.5px;line-height:1.35;padding-top:1px;word-break:break-word}
.item.locked .txt{color:var(--muted)}
.stamp{flex:none;margin-left:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:var(--sage);padding-top:4px;letter-spacing:.03em}
.thumb{flex:none;width:34px;height:34px;border-radius:8px;object-fit:cover;margin-left:8px;border:1px solid var(--line)}

/* оверлей подтверждения */
.confirm{display:flex;align-items:center;gap:8px;padding:0 2px 15px;animation:pop .18s ease-out}
.confirm input{flex:1;min-width:0;font:inherit;font-size:15px;color:var(--paper);background:rgba(238,242,246,.07);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.confirm input:focus{outline:none;border-color:var(--ac)}
.confirm .btns{display:flex;gap:8px;padding:0 2px 15px}
.nt{font-size:13.5px;color:var(--muted);line-height:1.35;margin-top:5px}
.nt:before{content:'— '}
@keyframes pop{from{opacity:0;transform:scale(.97)}}
.cbtn{border:0;font:inherit;font-size:14.5px;font-weight:500;padding:10px 18px;border-radius:11px;color:var(--ink);background:var(--sage)}
.cbtn.ghost{background:rgba(238,242,246,.12);color:var(--paper)}
.cbtn.cam{background:rgba(238,242,246,.12);color:var(--paper);padding:10px 12px;display:grid;place-items:center}
.cbtn.cam.has{background:transparent;border:1.5px solid var(--ac);color:var(--ac)}
.cbtn svg{width:17px;height:17px;display:block}

/* ---------- общие ---------- */
.h{font-size:22px;font-weight:400;margin:0 0 4px}
.sub{font-size:14px;color:var(--muted);line-height:1.5;margin:0 0 22px}
.card{background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r)}
.big{display:block;width:100%;text-align:left;font:inherit;font-size:16px;color:var(--paper);background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:10px}
.big span{display:block;font-size:13px;color:var(--muted);margin-top:3px}
.big:active{background:rgba(238,242,246,.08)}
.link{background:none;border:0;font:inherit;font-size:15px;color:var(--sand);padding:12px 0}
.link.danger{color:#D98B7E}
input[type=text]{width:100%;font:inherit;font-size:16px;color:var(--paper);background:rgba(238,242,246,.07);border:1px solid var(--line);border-radius:11px;padding:13px 14px}
input[type=text]:focus{outline:none;border-color:var(--sand)}
.empty{text-align:center;color:var(--muted);font-size:14.5px;line-height:1.6;padding:50px 20px}

/* сценарии */
.srow{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .nm{font-size:16px}
.srow .ct{font-size:13px;color:var(--muted);margin-left:auto}
.editrow{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);background:transparent;position:relative}
.editrow .t{font-size:16px;flex:1;line-height:1.35;padding:4px 0;word-break:break-word}
.editrow input{flex:1;min-width:0;padding:9px 11px;font-size:16px}
.editrow.dragging{z-index:5;background:rgba(20,28,38,.96);box-shadow:0 8px 24px rgba(0,0,0,.45);border-radius:10px;border-bottom-color:transparent}
.grip{flex:none;color:var(--muted);padding:8px 6px;touch-action:none;display:grid;place-items:center;cursor:grab}
.grip svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}
.hint{font-size:12.5px;color:var(--muted);margin:10px 0 0;line-height:1.5}

/* очистка истории */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 18px}
.chip{border:1px solid var(--line);background:rgba(238,242,246,.06);color:var(--paper);font:inherit;font-size:14px;border-radius:20px;padding:8px 14px}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--ink)}
.range{display:flex;gap:10px;align-items:center;margin-bottom:16px}
.range label{flex:1;font-size:12.5px;color:var(--muted)}
.range input{display:block;width:100%;margin-top:5px;font:inherit;font-size:15px;color:var(--paper);background:rgba(238,242,246,.07);border:1px solid var(--line);border-radius:11px;padding:11px 12px;color-scheme:dark}
.toggle{display:flex;align-items:center;gap:12px;padding:14px 0;font-size:15px}
.toggle .sw2{margin-left:auto;flex:none;width:44px;height:26px;border-radius:13px;background:rgba(238,242,246,.15);position:relative;transition:.18s}
.toggle .sw2:after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--paper);transition:.18s}
.toggle.on .sw2{background:var(--ac)}
.toggle.on .sw2:after{left:21px;background:var(--ink)}
.summary{font-size:14.5px;line-height:1.55;padding:14px 16px;margin-bottom:6px}
.btn-danger{display:block;width:100%;border:0;font:inherit;font-size:16px;font-weight:500;background:#D98B7E;color:var(--ink);border-radius:13px;padding:15px;margin-top:12px}
.btn-danger:disabled{background:rgba(238,242,246,.1);color:#5D6874}

/* праздник */
#party{position:fixed;inset:0;z-index:70;display:none}
#party canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#party .pc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(8,12,17,.8);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:fadein .2s ease-out}
#party img{max-width:70vw;max-height:42vh;border-radius:16px;animation:boing .6s cubic-bezier(.2,1.6,.4,1)}
#party .yip{font-size:54px;font-weight:800;color:var(--ac);letter-spacing:.01em;text-shadow:0 4px 18px rgba(0,0,0,.5);animation:boing .6s cubic-bezier(.2,1.6,.4,1),wig 1.1s ease-in-out .6s infinite}
#party .sm{font-size:13px;color:var(--muted)}
@keyframes boing{from{transform:scale(.3);opacity:0}}
@keyframes fadein{from{opacity:0}}
@keyframes wig{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.x{border:0;background:none;color:var(--muted);padding:6px;display:grid;place-items:center}
.x svg{width:16px;height:16px}
.addbar{display:flex;gap:8px;margin-top:16px}
.addbar button{flex:none;border:0;font:inherit;font-size:15px;font-weight:500;background:var(--sand);color:var(--ink);border-radius:11px;padding:0 18px}

/* дни недели в сценарии */
.wdays{display:flex;gap:6px;margin:4px 0 22px}
.wd{flex:1;text-align:center;font-size:13px;color:var(--muted);background:rgba(238,242,246,.06);border:1px solid var(--line);border-radius:9px;padding:9px 0;transition:.15s}
.wd.on{background:var(--ac);border-color:var(--ac);color:var(--ink);font-weight:500}

/* группы сценариев внутри дня */
.grp{display:flex;align-items:baseline;gap:10px;margin:24px 0 0;padding-bottom:9px;border-bottom:1px solid var(--line)}
.grp .g{font-size:14px;font-weight:500}
.grp .c{margin-left:auto;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.grp .c.full{color:var(--ac)}

/* выбор сценариев */
.pk{display:flex;align-items:center;gap:14px;padding:15px 18px;border-bottom:1px solid var(--line)}
.pk:last-child{border-bottom:0}
.pk .nm{font-size:16px}
.pk .ct{font-size:13px;color:var(--muted);margin-top:2px}
.pk .bx{flex:none;width:22px;height:22px;border:1.5px solid var(--muted);border-radius:7px;display:grid;place-items:center;margin-left:auto;transition:.15s}
.pk.on .bx{background:var(--ac);border-color:var(--ac)}
.pk .bx svg{width:13px;height:13px;opacity:0}
.pk.on .bx svg{opacity:1}
.start{display:block;width:100%;border:0;font:inherit;font-size:16px;font-weight:500;background:var(--ac);color:var(--ink);border-radius:13px;padding:15px;margin-top:16px}
.start:disabled{background:rgba(238,242,246,.1);color:#5D6874}

/* календарь */
.calhead{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 14px}
.calhead .m{font-size:16.5px;font-weight:500}
.arw{border:0;background:none;color:var(--paper);padding:8px 14px;display:grid;place-items:center}
.arw svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.arw:disabled{color:#4C5561}
.wk,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.wk span{text-align:center;font-size:11px;color:var(--muted);padding-bottom:6px}
.cell{aspect-ratio:1;display:grid;place-items:center;border-radius:11px;font-size:14.5px;color:#5D6874;position:relative;font-variant-numeric:tabular-nums}
.cell.has{color:var(--paper)}
.cell.now{box-shadow:inset 0 0 0 1px var(--line)}
.cell.sel{background:rgba(238,242,246,.13)}
.cell i{position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;border:1px solid var(--ac);opacity:.75}
.cell.full i{background:var(--ac)}
.dtitle{display:flex;align-items:baseline;gap:10px;padding:15px 18px 0}
.dtitle .d{font-size:15.5px}
.dtitle .s{font-size:13px;color:var(--muted)}
.dtitle .n{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.dtitle .n.full{color:var(--ac)}

/* история */
.dayrow{padding:15px 18px;border-bottom:1px solid var(--line)}
.dayrow:last-child{border-bottom:0}
.dayrow .top{display:flex;align-items:baseline;gap:10px}
.dayrow .d{font-size:15.5px}
.dayrow .s{font-size:13px;color:var(--muted)}
.dayrow .n{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.dayrow .n.full{color:var(--sage)}
.detail{margin-top:12px;padding-top:4px}
.dbody{padding:2px 18px 14px}
.gsub{font-size:12.5px;color:var(--muted);margin:12px 0 2px;letter-spacing:.02em}
.detail div{display:flex;gap:10px;font-size:14.5px;padding:6px 0;color:var(--muted)}
.detail .tm{margin-left:auto;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--sage)}
.detail .no{color:#7C8794}

/* настройки */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:8px}
.sw{aspect-ratio:1/1.35;border-radius:12px;border:1.5px solid transparent;position:relative;overflow:hidden;background-size:cover;background-position:center}
.sw.on{border-color:var(--sand)}
.slider{width:100%;margin:14px 0 4px;accent-color:var(--sand)}
.note{font-size:13px;color:var(--muted);line-height:1.6}

/* нав */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;padding:6px 8px calc(6px + var(--safe-b));background:rgba(13,19,27,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
nav button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:10.5px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:4px}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--paper)}

/* просмотр фото */
#viewer{position:fixed;inset:0;background:rgba(8,12,17,.94);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
#viewer img{max-width:100%;max-height:82%;border-radius:12px}
#viewer .cap{position:absolute;bottom:calc(28px + var(--safe-b));font-size:13px;color:var(--muted)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="bg"></div><div id="scrim"></div>
<main id="view"></main>
<nav id="nav"></nav>
<div id="viewer"><img alt=""><div class="cap">Нажмите, чтобы закрыть</div></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="bgfile" accept="image/*" hidden>
<input type="file" id="cheerfile" accept="image/*" hidden>
<div id="party"></div>

<script>
/* ============ хранилище ============ */
const KEY='tochno.v1';
let mem=null, useLS=true;
try{localStorage.setItem('_t','1');localStorage.removeItem('_t')}catch(e){useLS=false}
/* в APK данные пишутся в файл телефона через мост, в браузере — в localStorage */
const NATIVE=window.TochnoNative||null;
function load(){
  try{
    const r=NATIVE?NATIVE.load():(useLS?localStorage.getItem(KEY):mem);
    if(r) return JSON.parse(r);
  }catch(e){}
  return null;
}
function save(){
  const s=JSON.stringify(S);
  try{
    if(NATIVE){ if(!NATIVE.save(s)) throw new Error('write'); }
    else if(useLS) localStorage.setItem(KEY,s); else mem=s;
  }
  catch(e){ alert(NATIVE?'Не удалось сохранить. Проверьте, есть ли свободное место на телефоне.':'Не хватило места в памяти. Скорее всего из-за фотографий — удалите фон-картинку или старые дни.'); }
}

/* ============ состояние ============ */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const BGS=[
 {id:'night', css:'linear-gradient(170deg,#1B2836,#141C26 60%,#101720)'},
 {id:'moss',  css:'linear-gradient(165deg,#1D2A26,#141D1A 65%,#0F1614)'},
 {id:'clay',  css:'linear-gradient(165deg,#2A211D,#1C1614 65%,#141010)'},
 {id:'plum',  css:'linear-gradient(165deg,#241B2C,#181320 65%,#110E17)'},
 {id:'slate', css:'linear-gradient(165deg,#232629,#17191C 65%,#111315)'},
 {id:'sea',   css:'linear-gradient(165deg,#16292E,#101E22 65%,#0C1517)'}
];
const ACCENTS=[
 {id:'sage',c:'#8FBBA4'},{id:'sand',c:'#E3C08C'},{id:'sky',c:'#8FB6D9'},
 {id:'lilac',c:'#B6A9DE'},{id:'rose',c:'#DDA3A9'},{id:'mint',c:'#7FCBC4'}
];
const DEF={
  scenarios:[
    {id:uid(),name:'Рабочий день',items:[
      {id:uid(),text:'Выключил свет во всех комнатах'},
      {id:uid(),text:'Закрыл окна'},
      {id:uid(),text:'Проверил плиту'},
      {id:uid(),text:'Закрыл воду'},
      {id:uid(),text:'Взял ключи и телефон'},
      {id:uid(),text:'Запер дверь'}
    ]},
    {id:uid(),name:'Выходной',items:[
      {id:uid(),text:'Проверил плиту'},
      {id:uid(),text:'Закрыл воду'},
      {id:uid(),text:'Запер дверь'}
    ]}
  ],
  days:{},
  bg:'night', scrim:55, bgphoto:null, accent:'sage'
};
let S=load()||DEF;
let tab='today', pending=null, pendingPhoto=null, editing=null, openDay=null;
let calY=new Date().getFullYear(), calM=new Date().getMonth();
let picked=new Set(), picking=false, pendingNote='';
let lateRender=null, editItem=null, cleaning=false, cFrom='', cTo='', cPreset='old', cPhotosOnly=false;

/* ============ утилиты ============ */
const el=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function key(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function yKey(){const d=new Date();d.setDate(d.getDate()-1);return key(d)}
function human(k){
  const [y,m,dd]=k.split('-').map(Number);
  return new Date(y,m-1,dd).toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
}
function shortDate(k){
  const [y,m,dd]=k.split('-').map(Number);
  return new Date(y,m-1,dd).toLocaleDateString('ru-RU',{day:'numeric',month:'short',weekday:'short'});
}
function hhmm(ts){const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
const ICO={
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="#141C26" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 6"/></svg>',
  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A2 2 0 015 6.5h2l1.4-2h7.2L17 6.5h2a2 2 0 012 2V18a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><circle cx="12" cy="13" r="3.4"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  grip:'<svg viewBox="0 0 24 24"><path d="M5 8h14M5 12h14M5 16h14"/></svg>',
  prev:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  next:'<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
  today:'<svg viewBox="0 0 24 24"><path d="M4 11.5l5 5 11-11"/></svg>',
  scen:'<svg viewBox="0 0 24 24"><path d="M5 5h14M5 12h14M5 19h9"/></svg>',
  hist:'<svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="16" rx="2.5"/><path d="M8 2.5v4M16 2.5v4M3.5 10h17"/></svg>',
  set:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M21.5 12h-3M5.5 12h-3M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1M18.7 18.7l-2.1-2.1M7.4 7.4L5.3 5.3"/></svg>'
};

/* ============ фон ============ */
function paintBg(){
  const b=el('#bg');
  if(S.bgphoto){b.style.backgroundImage='url('+S.bgphoto+')';b.style.background='';b.style.backgroundImage='url('+S.bgphoto+')';b.style.backgroundSize='cover';b.style.backgroundPosition='center'}
  else{const g=BGS.find(x=>x.id===S.bg)||BGS[0];b.style.backgroundImage=g.css}
  el('#scrim').style.opacity=S.scrim/100;
  const a=ACCENTS.find(x=>x.id===S.accent)||ACCENTS[0];
  document.documentElement.style.setProperty('--ac',a.c);
  el('#view').style.zoom=(S.fs||100)/100;
}

/* ============ день ============ */
function today(){return S.days[key()]}

/* старые дни хранили один сценарий — приводим к общему виду */
function migrate(){
  let ch=false;
  Object.values(S.days).forEach(d=>{
    if(!d.scenarios){
      d.scenarios=[d.scenario||'День'];
      d.items.forEach(i=>{if(!i.g)i.g=d.scenarios[0]});
      ch=true;
    }
  });
  if(ch)save();
}

function pour(day,sc){
  if(!day.scenarios.includes(sc.name))day.scenarios.push(sc.name);
  sc.items.forEach(it=>day.items.push({id:uid(),text:it.text,g:sc.name,pos:day.items.length,at:null,photo:null}));
}
function names(d){return (d.scenarios||[d.scenario]).join(' · ')}

/* день считается несобранным, пока в нём нет пунктов */
function ready(d){return d && d.items && d.items.length}

/* автосборка: сценарии, отмеченные на этот день недели */
function autoBuild(){
  const k=key();
  if(S.days[k])return;                       // уже собран или намеренно очищен
  const wd=new Date().getDay();
  const due=S.scenarios.filter(s=>(s.days||[]).includes(wd) && s.items.length);
  if(!due.length)return;
  const day={scenarios:[],items:[],auto:true};
  due.forEach(sc=>pour(day,sc));
  S.days[k]=day;save();
}

/* ============ рендер ============ */
function render(){
  clearTimeout(lateRender);
  autoBuild();
  const v=el('#view');
  if(tab==='today')v.innerHTML=vToday();
  if(tab==='scen')v.innerHTML=editing?vEditor():vScen();
  if(tab==='hist')v.innerHTML=vHist();
  if(tab==='set')v.innerHTML=vSet();
  el('#nav').innerHTML=[['today','Сегодня'],['scen','Сценарии'],['hist','История'],['set','Настройки']]
    .map(([k,n])=>`<button data-tab="${k}" class="${tab===k?'on':''}">${ICO[k==='today'?'today':k==='scen'?'scen':k==='hist'?'hist':'set']}${n}</button>`).join('');
  paintBg();
}

/* --- Сегодня --- */
function vItem(i){
  if(pending===i.id) return `<li class="item pending"><div class="row"><div class="box"></div><div class="txt">${esc(i.text)}</div></div>
    <div class="confirm">
      <input type="text" id="note" placeholder="Заметка, если нужна" value="${esc(pendingNote)}">
      <button class="cbtn cam ${pendingPhoto?'has':''}" data-photo="1">${ICO.cam}</button>
    </div>
    <div class="confirm btns" style="justify-content:flex-end">
      <button class="cbtn ghost" data-no="1">Отмена</button>
      <button class="cbtn" data-yes="${i.id}">Подтвердить</button>
    </div></li>`;
  return `<li class="item ${i.at?'locked':''}" ${i.at?'':`data-tap="${i.id}"`}>
    <div class="row"><div class="box">${ICO.check}</div>
    <div style="min-width:0"><div class="txt">${esc(i.text)}</div>${i.note?`<div class="nt">${esc(i.note)}</div>`:''}</div>
    ${i.at?`<span class="stamp">${hhmm(i.at)}</span>`:''}
    ${i.photo?`<img class="thumb" src="${i.photo}" data-zoom="${i.photo}" alt="">`:''}</div></li>`;

/* выбор сценариев: mode 'new' — на пустой день, 'add' — докинуть к текущему */
function vPicker(mode){
  const used=mode==='add'?today().scenarios:[];
  const free=S.scenarios.filter(s=>!used.includes(s.name));
  const y=ready(S.days[yKey()])?S.days[yKey()]:null;
  if(!S.scenarios.length)
    return `<div class="empty">Сценариев пока нет.<br>Создайте первый на вкладке «Сценарии».</div>`;
  if(!free.length)
    return `<div class="empty">Все сценарии уже назначены на сегодня.</div>
      <div style="text-align:center"><button class="link" data-cancel="1">Назад</button></div>`;

  return `<p class="sub" style="margin-top:22px">${mode==='add'?'Что ещё добавить к сегодняшнему дню?':'Выберите один или несколько сценариев на сегодня.'}</p>`+
  (mode==='new'&&y?`<button class="big" data-same="1"><b style="font-weight:500">Как вчера</b><span>${esc(names(y))}</span></button>`:'')+
  `<div class="card">`+free.map(s=>
    `<div class="pk ${picked.has(s.id)?'on':''}" data-pick="${s.id}">
      <div><div class="nm">${esc(s.name)}</div><div class="ct">${s.items.length} ${plural(s.items.length)}</div></div>
      <div class="bx">${ICO.check}</div>
    </div>`).join('')+`</div>`+
  `<button class="start" data-start="${mode}" ${picked.size?'':'disabled'}>${
     mode==='add'?'Добавить':'Начать день'}${picked.size?' · '+picked.size:''}</button>`+
  (mode==='add'?`<div style="text-align:center"><button class="link" data-cancel="1">Отмена</button></div>`:'');
}

function vToday(){
  const d=today();
  const hd=`<div class="daylabel">Сегодня</div><h1 class="date">${human(key()).replace(/, /,',<br><b>')}</b></h1>`;
  if(!ready(d))return hd+vPicker('new');
  if(picking)return hd+vPicker('add');

  const done=d.items.filter(i=>i.at).length, all=d.items.length;
  const multi=d.scenarios.length>1;
  const body=d.scenarios.map(g=>{
    const its=d.items.filter(i=>i.g===g);
    if(!its.length)return '';
    const gd=its.filter(i=>i.at).length;
    return (multi?`<div class="grp"><span class="g">${esc(g)}</span>
      <span class="c ${gd===its.length?'full':''}">${gd}/${its.length}</span></div>`:'')+
      `<ul class="list">`+its.map(vItem).join('')+`</ul>`;
  }).join('');

  return hd+
  `<div class="scenline"><span class="scenname">${multi?d.scenarios.length+' '+splural(d.scenarios.length):esc(d.scenarios[0])}</span>
   <span class="count ${done===all?'done':''}">${done} из ${all}</span></div>`+
  body+
  (done===all?`<div class="empty" style="color:var(--ac);padding:32px 20px 8px">Всё отмечено. Можно идти.</div>`:'')+
  `<div style="text-align:center;margin-top:10px">
    <button class="link" data-addscen="1">Добавить сценарий</button><br>
    <button class="link" data-reset="1" style="font-size:14px;color:var(--muted)">Собрать день заново</button>
  </div>`;
}
function splural(n){const a=n%10,b=n%100;return a===1&&b!==11?'сценарий':a>=2&&a<=4&&(b<10||b>=20)?'сценария':'сценариев'}
function plural(n){const a=n%10,b=n%100;return a===1&&b!==11?'пункт':a>=2&&a<=4&&(b<10||b>=20)?'пункта':'пунктов'}

/* --- Сценарии --- */
function vScen(){
  return `<h2 class="h">Сценарии</h2><p class="sub">Наборы пунктов, которые вы назначаете на день.</p>`+
  (S.scenarios.length?`<div class="card">`+S.scenarios.map(s=>
    `<div class="srow" data-edit="${s.id}"><div><span class="nm">${esc(s.name)}</span>${

   :`<div class="empty">Пусто. Создайте первый сценарий — например, «Рабочий день».</div>`)+

function vEditor(){

    .map(([n,l])=>`<div class="wd ${(s.days||[]).includes(n)?'on':''}" data-wd="${n}">${l}</div>`).join('')}</div>
  ${s.items.length?`<div id="elist">`+s.items.map(i=>`<div class="editrow" data-iid="${i.id}">
      <span class="grip" data-grip="1">${ICO.grip}</span>
      ${editItem===i.id

    <p class="hint">Нажмите на пункт, чтобы изменить текст. Тяните за ≡, чтобы поменять порядок.</p>`

  <div class="addbar"><input type="text" id="ni" placeholder="Новый пункт"><button data-add="1">Добавить</button></div>
  <div style="text-align:center;margin-top:34px"><button class="link danger" data-drop="1">Удалить сценарий</button></div>`;

/* --- История --- */
function vHist(){
  const first=new Date(calY,calM,1);
  const shift=(first.getDay()+6)%7;              // неделя с понедельника
  const total=new Date(calY,calM+1,0).getDate();
  const tk=key(), now=new Date();
  const curOrLater=(calY>now.getFullYear())||(calY===now.getFullYear()&&calM>=now.getMonth());
  const past=!curOrLater;
  const month=first.toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
  const pfx=calY+'-'+String(calM+1).padStart(2,'0')+'-';
  const inMonth=Object.keys(S.days).filter(k=>k.startsWith(pfx)&&ready(S.days[k])).length;

  let cells='';
  for(let i=0;i<shift;i++)cells+='<div></div>';
  for(let n=1;n<=total;n++){
    const k=calY+'-'+String(calM+1).padStart(2,'0')+'-'+String(n).padStart(2,'0');
    const d=ready(S.days[k])?S.days[k]:null;
    const done=d?d.items.filter(i=>i.at).length:0;
    const cl=['cell',d?'has':'',k===tk?'now':'',openDay===k?'sel':'',d&&done===d.items.length?'full':''].filter(Boolean).join(' ');
    cells+=`<div class="${cl}" ${d?`data-day="${k}"`:''}>${n}${d?'<i></i>':''}</div>`;
  }

  const d=openDay?S.days[openDay]:null;
  let panel='';
  if(d){
    const done=d.items.filter(i=>i.at).length;
    panel=`<div class="card" style="margin-top:16px">
      <div class="dtitle"><span class="d">${shortDate(openDay)}</span><span class="s">${esc(names(d))}</span>
      <span class="n ${done===d.items.length?'full':''}">${done}/${d.items.length}</span></div>
      <div class="dbody">`+(d.scenarios||[d.scenario]).map(g=>{
        const its=d.items.filter(i=>(i.g||d.scenario)===g);
        if(!its.length)return '';
        return ((d.scenarios||[]).length>1?`<div class="gsub">${esc(g)}</div>`:'')+
          `<div class="detail">`+its.map(i=>
            `<div class="${i.at?'':'no'}">${esc(i.text)}<span class="tm" ${i.at?'':'style="color:#7C8794"'}>${i.at?hhmm(i.at):'—'}</span></div>`
          ).join('')+`</div>`;
      }).join('')+`</div></div>`;
  } else {
    panel=`<p class="sub" style="text-align:center;margin:22px 0 0">${Object.keys(S.days).length?'Выберите день с отметкой.':'Отмеченные дни появятся в календаре.'}</p>`;
  }

  return `<h2 class="h">История</h2><p class="sub">Точками отмечены дни с записями. Закрашенная — все пункты выполнены.</p>
  <div class="card" style="padding:12px 12px 16px">
    <div class="calhead">
      <button class="arw" data-mon="-1">${ICO.prev}</button>
      <span class="m">${month.charAt(0).toUpperCase()+month.slice(1)}</span>
      <button class="arw" data-mon="1" ${curOrLater?'disabled':''}>${ICO.next}</button>
    </div>
    <div class="wk"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div>
    <div class="days">${cells}</div>
  </div>`+panel+
  (past&&inMonth?`<div style="text-align:center;margin-top:18px">
    <button class="link danger" data-delmon="${pfx}" data-cnt="${inMonth}" data-mname="${esc(first.toLocaleDateString('ru-RU',{month:'long'}))}">Удалить записи за ${esc(first.toLocaleDateString('ru-RU',{month:'long'}))}</button>
  </div>`:'');
}

/* --- Настройки --- */
/* --- Очистка истории --- */
function shiftKey(days){const d=new Date();d.setDate(d.getDate()+days);return key(d)}
function histKeys(){return Object.keys(S.days).filter(k=>k!==key()).sort()}   // сегодняшний день не трогаем
function presetRange(p){
  const ks=histKeys(), first=ks[0]||yKey(), y=yKey();
  if(p==='old')return [first, shiftKey(-31)];
  if(p==='all')return [first, y];
  if(p==='prev'){
    const n=new Date(), a=new Date(n.getFullYear(),n.getMonth()-1,1), b=new Date(n.getFullYear(),n.getMonth(),0);
    return [key(a), key(b)];
  }
  return [cFrom||first, cTo||y];
}
function presetFix(r){return r[0]>r[1]?[r[1],r[1]]:r}
function cleanTargets(){
  if(!cFrom||!cTo||cFrom>cTo)return {days:[],keys:[],photos:0,marks:0};
  const keys=histKeys().filter(k=>k>=cFrom&&k<=cTo);
  const days=keys.filter(k=>ready(S.days[k]));
  let photos=0, marks=0;
  days.forEach(k=>S.days[k].items.forEach(i=>{if(i.photo)photos++;if(i.at)marks++}));
  return {days,keys,photos,marks};
}
function vClean(){
  const n=new Date(), pm=new Date(n.getFullYear(),n.getMonth()-1,1).toLocaleDateString('ru-RU',{month:'long'});
  const t=cleanTargets();
  const nothing=cPhotosOnly?!t.photos:!t.days.length;
  const what=cPhotosOnly
    ?`Будет удалено фото: <b>${t.photos}</b>. Отметки и время останутся.`
    :`Будет удалено дней: <b>${t.days.length}</b>, отметок: ${t.marks}, фото: ${t.photos}.`;
  return `<button class="link" data-cleanback="1">← Настройки</button>
  <h2 class="h" style="margin-top:6px">Очистить историю</h2>
  <p class="sub">Сценарии, настройки и сегодняшний день не затрагиваются.</p>
  <div class="chips">
    <button class="chip ${cPreset==='old'?'on':''}" data-preset="old">Старше месяца</button>
    <button class="chip ${cPreset==='prev'?'on':''}" data-preset="prev">За ${esc(pm)}</button>
    <button class="chip ${cPreset==='all'?'on':''}" data-preset="all">Всё, кроме сегодня</button>
    <button class="chip ${cPreset==='custom'?'on':''}" data-preset="custom">Свой период</button>
  </div>
  <div class="range">
    <label>С<input type="date" id="cfrom" value="${cFrom}" max="${yKey()}"></label>
    <label>По<input type="date" id="cto" value="${cTo}" max="${yKey()}"></label>
  </div>
  <div class="toggle ${cPhotosOnly?'on':''}" data-photosonly="1">Удалить только фото<span class="sw2"></span></div>
  <div class="card summary">${cFrom>cTo?'Дата «с» позже даты «по».':(nothing?'За этот период удалять нечего.':what)}</div>
  <button class="btn-danger" data-doclean="1" ${nothing||cFrom>cTo?'disabled':''}>Удалить</button>`;
}

function vSet(){
  if(cleaning)return vClean();
  return `<h2 class="h">Настройки</h2><p class="sub">Фон главного экрана.</p>
  <div class="grid">${BGS.map(b=>`<div class="sw ${(!S.bgphoto&&S.bg===b.id)?'on':''}" data-bg="${b.id}" style="background-image:${b.css}"></div>`).join('')}</div>
  <button class="big" style="margin-top:12px" data-bgphoto="1">Своя картинка<span>${S.bgphoto?'Загружена — нажмите, чтобы заменить':'Из галереи телефона'}</span></button>
  ${S.bgphoto?`<div style="text-align:center"><button class="link" data-nobg="1">Убрать картинку</button></div>`:''}
  <p class="sub" style="margin:30px 0 0">Размер текста.</p>
  <input class="slider" type="range" min="85" max="140" step="5" value="${S.fs||100}" id="fs">
  <p class="sub" style="margin:26px 0 0">Затемнение — чтобы текст читался поверх фона.</p>
  <input class="slider" type="range" min="15" max="90" value="${S.scrim}" id="sc">
  <p class="sub" style="margin:30px 0 12px">Цвет галочек и отметок времени.</p>
  <div class="grid">${ACCENTS.map(a=>`<div class="sw ${S.accent===a.id?'on':''}" data-ac="${a.id}" style="background:${a.c};aspect-ratio:1/.62"></div>`).join('')}</div>

  <div class="toggle ${S.party!==false?'on':''}" data-party="1" style="margin-top:22px">Праздник, когда всё отмечено<span class="sw2"></span></div>
  ${S.party!==false?`
  <button class="big" data-cheer="1">Картинка для праздника<span>${S.cheer?'Загружена — нажмите, чтобы заменить':'Своя картинка или гифка из галереи'}</span></button>
  <div style="text-align:center">
    <button class="link" data-testparty="1">Посмотреть</button>
    ${S.cheer?`&nbsp;·&nbsp;<button class="link" data-nocheer="1">Убрать картинку</button>`:''}
  </div>`:''}

  <p class="sub" style="margin:30px 0 10px">Память.</p>
  <button class="big" data-clean="1">Очистить историю<span>Удалить отметки и фото за выбранный период. Сценарии и настройки останутся.</span></button>

  <p class="note" style="margin-top:34px">Все записи хранятся только на этом устройстве. Приложение ничего не отправляет в сеть и работает без интернета.</p>
  <div style="text-align:center;margin-top:18px"><button class="link danger" data-wipe="1">Стереть все данные</button></div>`;
}

/* ============ события ============ */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-tap],[data-yes],[data-no],[data-photo],[data-pick],[data-same],[data-reset],[data-addscen],[data-cancel],[data-start],[data-edit],[data-new],[data-back],[data-del],[data-add],[data-wd],[data-drop],[data-day],[data-delmon],[data-mon],[data-ac],[data-bg],[data-bgphoto],[data-nobg],[data-wipe],[data-zoom],[data-ed],[data-party],[data-cheer],[data-testparty],[data-nocheer],[data-clean],[data-cleanback],[data-preset],[data-photosonly],[data-doclean]');
  if(!t)return;
  const D=t.dataset;

  if(D.zoom){const v=el('#viewer');v.querySelector('img').src=D.zoom;v.style.display='flex';return}
  if(D.tab){
    if(editing&&D.tab!=='scen')editing=null;
    if(D.tab==='hist'){const n=new Date();calY=n.getFullYear();calM=n.getMonth();openDay=S.days[key()]?key():null}
    tab=D.tab;pending=null;pendingPhoto=null;editItem=null;cleaning=false;render();return;
  }

  /* правка текста пункта */
  if(D.ed){saveName();editItem=D.ed;render();const f=el('#ei');if(f){f.focus();f.setSelectionRange(f.value.length,f.value.length)}return}

  /* праздник */
  if(D.party){S.party=S.party===false;save();render();return}
  if(D.cheer){el('#cheerfile').click();return}
  if(D.nocheer){S.cheer=null;save();render();return}
  if(D.testparty){celebrate();return}

  /* очистка истории */
  if(D.clean){cleaning=true;cPreset='old';[cFrom,cTo]=presetFix(presetRange('old'));cPhotosOnly=false;render();window.scrollTo(0,0);return}
  if(D.cleanback){cleaning=false;render();return}
  if(D.preset){cPreset=D.preset;[cFrom,cTo]=presetFix(presetRange(D.preset));render();return}
  if(D.photosonly){cPhotosOnly=!cPhotosOnly;render();return}
  if(D.doclean){
    const t=cleanTargets();
    const msg=cPhotosOnly
      ?`Удалить ${t.photos} фото за период ${shortDate(cFrom)} — ${shortDate(cTo)}? Отметки останутся.`
      :`Удалить ${t.days.length} дн. истории за период ${shortDate(cFrom)} — ${shortDate(cTo)}? Отменить будет нельзя.`;
    if(!confirm(msg))return;
    if(cPhotosOnly) t.days.forEach(k=>S.days[k].items.forEach(i=>{delete i.photo}));
    else t.keys.forEach(k=>delete S.days[k]);
    openDay=null;save();render();return;
  }

  /* сегодня */
  if(D.tap){pending=D.tap;pendingPhoto=null;pendingNote='';render();return}
  if(D.no){pending=null;pendingPhoto=null;pendingNote='';render();return}
  if(D.photo){const n=el('#note');if(n)pendingNote=n.value;el('#cam').click();return}
  if(D.yes){
    const n=el('#note'); if(n)pendingNote=n.value;
    const it=today().items.find(i=>i.id===D.yes);
    it.at=Date.now();
    if(pendingPhoto)it.photo=pendingPhoto;
    if(pendingNote.trim())it.note=pendingNote.trim();
    pending=null;pendingPhoto=null;pendingNote='';save();render();
    if(S.party!==false && today().items.every(i=>i.at)) celebrate();
    return;
  }
  if(D.pick){picked.has(D.pick)?picked.delete(D.pick):picked.add(D.pick);render();return}
  if(D.addscen){picking=true;picked=new Set();render();return}
  if(D.cancel){picking=false;picked=new Set();render();return}
  if(D.start){
    const chosen=[...picked].map(id=>S.scenarios.find(s=>s.id===id)).filter(Boolean);
    if(!chosen.length)return;
    if(D.start==='new')S.days[key()]={scenarios:[],items:[]};
    const day=S.days[key()];
    chosen.forEach(sc=>pour(day,sc));
    picked=new Set();picking=false;save();render();return;
  }
  if(D.same){
    const y=S.days[yKey()];
    S.days[key()]={scenarios:[...y.scenarios],items:y.items.map((i,n)=>({id:uid(),text:i.text,g:i.g,pos:n,at:null,photo:null}))};
    save();render();return;
  }
  if(D.reset){
    const d=today();
    if(d.items.some(i=>i.at)&&!confirm('Все отметки за сегодня будут стёрты. Собрать день заново?'))return;
    S.days[key()]={scenarios:[],items:[]};picking=false;picked=new Set();save();render();return;
  }

  /* сценарии */
  if(D.edit){editing=D.edit;render();return}
  if(D.new){const s={id:uid(),name:'Новый сценарий',items:[]};S.scenarios.push(s);editing=s.id;save();render();return}
  if(D.back){saveName();editing=null;render();return}
  if(D.del){saveName();const s=S.scenarios.find(x=>x.id===editing);s.items=s.items.filter(i=>i.id!==D.del);save();render();return}
  if(D.wd){
    saveName();
    const s=S.scenarios.find(x=>x.id===editing), n=+D.wd;
    s.days=s.days||[];
    s.days.includes(n)?s.days=s.days.filter(x=>x!==n):s.days.push(n);
    save();render();return;
  }
  if(D.add){addItem();return}
  if(D.drop){
    if(!confirm('Удалить сценарий? Прошлые дни останутся в истории.'))return;
    S.scenarios=S.scenarios.filter(x=>x.id!==editing);editing=null;save();render();return;
  }

  /* история */
  if(D.day){openDay=openDay===D.day?null:D.day;render();return}
  if(D.delmon){
    const n=+D.cnt;
    if(!confirm(`Удалить все записи за ${D.mname}? Дней с отметками: ${n}. Фото этих дней тоже удалятся. Отменить будет нельзя.`))return;
    Object.keys(S.days).filter(k=>k.startsWith(D.delmon)).forEach(k=>delete S.days[k]);
    openDay=null;save();render();return;
  }
  if(D.mon){
    const m=calM+ +D.mon;
    calY+=Math.floor(m/12); calM=(m%12+12)%12;
    render();return;
  }
  if(D.ac){S.accent=D.ac;save();render();return}

  /* настройки */
  if(D.bg){S.bg=D.bg;S.bgphoto=null;save();render();return}
  if(D.bgphoto){el('#bgfile').click();return}
  if(D.nobg){S.bgphoto=null;save();render();return}
  if(D.wipe){if(confirm('Стереть все сценарии и всю историю?')){S=JSON.parse(JSON.stringify(DEF));S.days={};save();render()}return}
});
function saveName(){const n=el('#nm');if(n&&editing){const s=S.scenarios.find(x=>x.id===editing);if(s){s.name=n.value.trim()||'Без названия';save()}}}
function addItem(){
  const f=el('#ni'); if(!f||!f.value.trim())return;
  saveName();
  S.scenarios.find(x=>x.id===editing).items.push({id:uid(),text:f.value.trim()});
  save();render();
  const n=el('#ni'); if(n)n.focus();
}
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='ni'){e.preventDefault();addItem()}
  if(e.key==='Enter'&&e.target.id==='ei'){e.preventDefault();e.target.blur()}
});

/* правка пункта сохраняется, когда поле теряет фокус */
function commitEdit(){
  const f=el('#ei'); if(!f||!editItem)return;
  const s=S.scenarios.find(x=>x.id===editing);
  const it=s&&s.items.find(i=>i.id===editItem);
  if(it&&f.value.trim())it.text=f.value.trim();
  editItem=null;save();
  clearTimeout(lateRender);lateRender=setTimeout(render,180);   // дать сработать тапу по другой кнопке
}
document.addEventListener('focusout',e=>{if(e.target.id==='ei')commitEdit()});

/* даты в очистке */
document.addEventListener('change',e=>{
  if(e.target.id==='cfrom'||e.target.id==='cto'){
    if(e.target.id==='cfrom')cFrom=e.target.value; else cTo=e.target.value;
    cPreset='custom';render();
  }
});

/* перетаскивание пунктов за ≡ */
let drag=null;
document.addEventListener('pointerdown',e=>{
  const g=e.target.closest('[data-grip]'); if(!g)return;
  e.preventDefault();
  const row=g.closest('.editrow');
  drag={row,list:row.parentElement,y0:e.clientY};
  row.classList.add('dragging');
  try{g.setPointerCapture(e.pointerId)}catch(_){}
});
document.addEventListener('pointermove',e=>{
  if(!drag)return;
  e.preventDefault();
  const {row,list}=drag;
  let dy=e.clientY-drag.y0;
  row.style.transform=`translateY(${dy}px)`;
  const rows=[...list.children], i=rows.indexOf(row);
  const r=row.getBoundingClientRect(), mid=r.top+r.height/2;
  const next=rows[i+1], prev=rows[i-1];
  if(next){const b=next.getBoundingClientRect(); if(mid>b.top+b.height/2){list.insertBefore(next,row);drag.y0+=b.height}}
  if(prev){const b=prev.getBoundingClientRect(); if(mid<b.top+b.height/2){list.insertBefore(row,prev);drag.y0-=b.height}}
  row.style.transform=`translateY(${e.clientY-drag.y0}px)`;
},{passive:false});
function endDrag(){
  if(!drag)return;
  const {row,list}=drag; drag=null;
  row.style.transform='';row.classList.remove('dragging');
  const s=S.scenarios.find(x=>x.id===editing); if(!s)return;
  const order=[...list.children].map(r=>r.dataset.iid);
  s.items.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));
  save();render();
}
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);

/* праздник: конфетти + картинка */
function celebrate(){
  const ov=el('#party');
  ov.innerHTML=`<div class="pc">${S.cheer?`<img src="${S.cheer}" alt="">`:''}<div class="yip">Yippee!</div><div class="sm">Всё отмечено</div></div><canvas></canvas>`;
  ov.style.display='block';
  let alive=true;
  const close=()=>{if(!alive)return;alive=false;ov.style.display='none';ov.innerHTML=''};
  ov.onclick=close;
  setTimeout(close,5500);
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;

  const c=ov.querySelector('canvas'), x=c.getContext('2d'), dpr=Math.min(2,window.devicePixelRatio||1);
  const W=innerWidth, H=innerHeight; c.width=W*dpr; c.height=H*dpr; x.scale(dpr,dpr);
  const cols=[getComputedStyle(document.documentElement).getPropertyValue('--ac').trim()||'#8FBBA4',
    '#E3C08C','#8FB6D9','#B6A9DE','#DDA3A9','#7FCBC4','#EEF2F6'];
  const P=[];
  // два «хлопка» из нижних углов
  [[0,1],[1,-1]].forEach(([sx,dir])=>{
    for(let n=0;n<85;n++){
      const a=0.08+Math.random()*0.42, sp=(19+Math.random()*12)*Math.sqrt(H/800);   // угол от вертикали
      P.push({x:sx*W,y:H+10,vx:Math.sin(a)*sp*dir,vy:-Math.cos(a)*sp,
        w:6+Math.random()*6,h:8+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.35,
        c:cols[(Math.random()*cols.length)|0],t:Math.random()*6});
    }
  });
  let last=performance.now();
  (function tick(now){
    if(!alive)return;
    const k=Math.min(2,(now-last)/16.7); last=now;
    x.clearRect(0,0,W,H);
    let any=false;
    for(const p of P){
      p.vy+=0.3*k; p.vx*=Math.pow(0.99,k); p.vy*=Math.pow(0.99,k);
      if(p.vy>2.6)p.vy=2.6;                 // на спуске бумажка парит
      p.x+=(p.vx+(p.vy>0?Math.sin(p.t)*0.9:0))*k; p.y+=p.vy*k; p.r+=p.vr*k; p.t+=0.12*k;
      if(p.y<H+40)any=true;
      x.save(); x.translate(p.x,p.y); x.rotate(p.r);
      x.scale(1,Math.cos(p.t));            // «переворачивание» бумажки
      x.fillStyle=p.c; x.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      x.restore();
    }
    if(any)requestAnimationFrame(tick);
  })(last);
}
document.addEventListener('input',e=>{
  if(e.target.id==='sc'){S.scrim=+e.target.value;el('#scrim').style.opacity=S.scrim/100;save()}
  if(e.target.id==='fs'){S.fs=+e.target.value;el('#view').style.zoom=S.fs/100;save()}
  if(e.target.id==='note'){pendingNote=e.target.value}
});
el('#viewer').addEventListener('click',()=>el('#viewer').style.display='none');

/* фото */
function shrink(file,max,q,mime){return new Promise(res=>{
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const k=Math.min(1,max/Math.max(im.width,im.height));
    const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    res(c.toDataURL(mime||'image/jpeg',q));
  };im.src=r.result};
  r.readAsDataURL(file);
})}
el('#cam').addEventListener('change',async e=>{
  if(!e.target.files[0]){render();return}
  pendingPhoto=await shrink(e.target.files[0],900,.6);
  e.target.value='';render();
});
/* картинка праздника: гифку храним как есть, чтобы не потерять анимацию */
el('#cheerfile').addEventListener('change',async e=>{
  const f=e.target.files[0]; e.target.value='';
  if(!f)return;
  const limit=NATIVE?8e6:1.5e6;
  if(f.type==='image/gif'||f.type==='image/webp'){
    if(f.size>limit){alert('Гифка слишком большая. Подойдёт до '+Math.round(limit/1e6*10)/10+' МБ.');return}
    S.cheer=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});
  } else {
    S.cheer=await shrink(f,800,.8,f.type==='image/png'?'image/png':'image/jpeg');
  }
  save();render();celebrate();
});

el('#bgfile').addEventListener('change',async e=>{
  if(!e.target.files[0])return;
  S.bgphoto=await shrink(e.target.files[0],1400,.72);
  e.target.value='';save();render();
});

/* офлайн-режим: только для http(s), локальный файл работает как раньше */
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  /* просим браузер не вычищать наши данные при нехватке места */
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
